<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenho Assinado</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 1. Script Oficial do Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h1>Gerador de Desenho</h1>

    <!-- 2. Configuração do botão do Google -->
    <!-- ATENÇÃO: Substitua o data-client_id abaixo pelo seu Client ID real -->
    <div id="g_id_onload"
         data-client_id="148267207268-bmmrbio5j2noe4bolp6p2pa90p0bc7m9.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    
    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>

    <!-- Mude de id="form-desenho" para id="formulario" -->
    <form id="formulario">
        <label for="numero">Número (1 a 100):</label>
        <input type="number" id="numero" name="numero" min="1" max="100" required>
        <button type="submit" id="btn-gerar">Gerar Desenho</button>
    </form>

    <div id="resultado"></div>
    <div id="erro" style="color: red;"></div>

    <script src="script.js"></script>
</body>
</html>
